<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrusel Cinta Transportadora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">


  <style>



    .section{
        background-color: rgb(22, 22, 22);
    }


    .section > *{
        font-family: Geis, sans-serif;
    }

    .section-header{
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        margin-bottom: 100px;
    }


        .section-title{
        display: inline-block;
        
        
        text-align: center;
        font-size: 30px;
        font-weight: 100;
        
        background-color: rgb(22, 22, 22);
        color: #f4f4f4;
        padding: 11px 28px;
        padding-top: 10px;
        border: solid 1px #8c8b8b;
        border-radius: 100px;
        
    }

    .comment{
        font-size: 50px;
        color: white;
        padding: 10px 200px;
        text-align: center;
        margin-top: 20px;
    }

   
    .carrusel {
      background-color: rgb(22, 22, 22);
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 15px 0;
      margin-top: -30px;
    }

    .carrusel-track {
      display: flex;
      animation: scroll linear infinite;
    }

    .card {
      background-color: rgb(33, 33, 33);
      flex: 0 0 auto;
      width: 350px;
      height: 450px;
      border-radius: 6%;
      margin-right: 20px;
      box-shadow: inset 0 0 1.2rem rgb(85, 85, 85);
    }

    .card > *{
         font-family: Geis, sans-serif;
    }


    .testimonial-card-top{
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        height: 25%;
        padding: 0px 30px;
        align-items: center;

        

       
    }

    .testimonial-quote-icon{
        width: 65px;
        height: 56px;
    }


    .testimonial-client-image{
        
        vertical-align: middle;
        max-width: 100%;
        display: inline-block;
       
    }


    .testimonial-text-block{
        height: 75%;
        padding: 0 25px;
        display: flex;
        flex-direction: column;
        justify-content: start;
    }


    .testimonial-text{
        font-size: 22px;
        
        color: white;
        text-align: center;
        padding-top: 50px;
    }

    .name-container{
        
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-bottom: 5px;
    }

    .name{
        font-size: 20px;
        font-weight: 400;
        color: white;
        
    }

    .role{
        font-size: 16px;
        color: rgb(173, 173, 173);
        margin-top: 5px;
         
    }




    @keyframes scroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

<section class="section">
<div class="section-header">
        <h2 class="section-title">Testimonios</h2>
        <div class="comment">Preferimos que sean nuestros clientes quienes te compartan su experiencia</div>
</div>

<div class="carrusel">
  <div class="carrusel-track" id="track">

                </div>

               <!--  <div class="testimonial-quote-icon-block">
                    <img class="testimonial-quote-icon" src="https://cdn.prod.website-files.com/681a3543e37b9a222a8ce9b8/68213673d973842c02e134e1_Quote%20Icon.svg" loading="lazy" alt="Quote Icon">

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const track = document.getElementById("track");
    const items = Array.from(track.children);

    // Duplicar los ítems para efecto infinito
    items.forEach(item => {
      const clone = item.cloneNode(true);
      track.appendChild(clone);
    });

    // Calcular ancho total
    const itemWidth = items[0].offsetWidth + parseInt(getComputedStyle(items[0]).marginRight);
    const totalItems = track.children.length;
    const totalWidth = itemWidth * totalItems;

    track.style.width = totalWidth + "px";

    // Ajustar duración de animación según ancho
    const velocidad = 200; // menor = más rápido
    const duracion = totalWidth / velocidad;
    track.style.animationDuration = duracion + "s";
  });
</script>
